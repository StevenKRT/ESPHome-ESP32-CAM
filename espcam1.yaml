esphome:
    name: espcam1
    friendly_name: ESPCam1

esp32:
    board: esp32cam
    framework:
        type: arduino

psram:
    mode: quad
    speed: 80MHz

# Enable logging
logger:

# Enable Home Assistant API
api:
    encryption:
        key: "xxxxxxxxxxxxxxxxxx"

ota:
    - platform: esphome
      password: "yyyyyyyyyyyyyyyyyy"

wifi:
    ssid: !secret wifi_ssid
    password: !secret wifi_password

    # Enable fallback hotspot (captive portal) in case wifi connection fails
    ap:
        ssid: "Espcam1 Fallback Hotspot"
        password: "zzzzzzzzzzzzzzzzzz"

    on_disconnect:
        then:
            - delay: 60s
            - button.press: espcam1_restart

captive_portal:

esp32_camera:
    id: cam1
    name: "Kamera"
    external_clock:
        pin: GPIO0
        frequency: 20MHz
    i2c_id: cam1_i2c
    data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
    vsync_pin: GPIO25
    href_pin: GPIO23
    pixel_clock_pin: GPIO22
    power_down_pin: GPIO32
    resolution: 1600x1200
    jpeg_quality: 10
    max_framerate: 3 fps
    wb_mode: AUTO
    aec_mode: AUTO
    agc_mode: AUTO

i2c:
    - id: cam1_i2c
      sda: GPIO26
      scl: GPIO27
      scan: false

esp32_camera_web_server:
    - port: 8080
      mode: stream

output:
    - platform: gpio
      pin: GPIO4
      id: espcam1_flash_out

light:
    - platform: binary
      name: "Licht"
      output: espcam1_flash_out
      restore_mode: ALWAYS_OFF

sensor:
    - platform: wifi_signal
      name: "WLAN Signal"
      update_interval: 60s

    - platform: uptime
      name: "Uptime"

binary_sensor:
    - platform: status
      name: "Status"

interval:
    - interval: 5min
      then:
          - logger.log: "Watchdog: zyklischer Gesundheitscheck"

button:
    - platform: restart
      name: "Neustart"
      id: espcam1_restart
